Configuration:
  name: BeakGraph
  status: WARN

  Appenders:
    Console:
      name: STDOUT
      target: SYSTEM_OUT
      PatternLayout:
        pattern: "%d{HH:mm:ss.SSS} [%t] %-5level %logger{36} - %msg%n"

    # Rolling, bounded (was a plain File appender that grew without limit for
    # the lifetime of an -endpoint server). The directory defaults to ./logs
    # under the process working directory; -Dbeakgraph.log.dir=<dir> moves it.
    RollingFile:
      name: FileAppender
      fileName: "${sys:beakgraph.log.dir:-logs}/beakgraph.log"
      filePattern: "${sys:beakgraph.log.dir:-logs}/beakgraph-%d{yyyy-MM-dd}-%i.log.gz"
      PatternLayout:
        pattern: "%d{ISO8601} [%t] %-5level %logger{36} - %msg%n"
      Policies:
        SizeBasedTriggeringPolicy:
          size: 50MB
        TimeBasedTriggeringPolicy:
          interval: 1
      DefaultRolloverStrategy:
        max: 10

  Loggers:
    Root:
      level: error
      AppenderRef:
        - ref: STDOUT
        - ref: FileAppender

    Logger:
      # BeakGraph's own progress reporting (quads loaded, dictionary/index build,
      # skipped geometries) lives at INFO/WARN - the root stays at ERROR so
      # third-party libraries remain quiet. Per-request LWS lines are DEBUG.
      - name: com.ebremer.beakgraph
        level: info
        additivity: false
        AppenderRef:
          - ref: STDOUT
          - ref: FileAppender
      - name: org.apache.jena.fuseki
        level: error
        additivity: false
        AppenderRef:
          - ref: STDOUT
          - ref: FileAppender
      - name: org.eclipse.jetty
        level: error
        additivity: false
        AppenderRef:
          - ref: STDOUT
          - ref: FileAppender
      - name: io.jhdf
        level: error
        additivity: false
        AppenderRef:
          - ref: STDOUT
          - ref: FileAppender
