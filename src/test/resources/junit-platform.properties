# Per-method backstop (BG-181): a hung test fails on its own with a thread
# dump instead of taking the whole surefire fork (and CI job) down with it.
# Applies to @Test/@ParameterizedTest methods and lifecycle methods; a
# @TestFactory's dynamic tests are not individually timed - the fork timeout
# in pom.xml still bounds those. Individual tests may tighten it with @Timeout.
junit.jupiter.execution.timeout.default = 10 m
junit.jupiter.execution.timeout.mode = enabled
# Tests run sequentially in one fork on purpose: several suites mutate
# JVM-global state (system properties, ARQ strict mode, a shared servlet
# server). They carry @Isolated, so enabling
# junit.jupiter.execution.parallel.enabled would still keep them apart (BG-189).
