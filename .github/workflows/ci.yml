# Linux + Windows test matrix. The Linux leg exists deliberately: the LWS
# symlink-escape test (LWSStorageServletTest.resolveWithinRejectsSymlinkEscape)
# auto-skips on Windows without symlink privileges, so Windows-only development
# never exercises that protection.
name: CI

on:
  push:
    # Feature branches get push CI too (they used to be covered only once a PR
    # was opened); pull_request still runs for forks.
    branches: [ master, next, 'rdf12*', 'feature/**' ]
  pull_request:
  # The native-image job below only runs when asked for (or nightly).
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * 1'

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest ]
    runs-on: ${{ matrix.os }}
    # Backstop above surefire's forkedProcessTimeoutInSeconds (pom.xml) and the
    # per-test timeout (junit-platform.properties): never the 6-hour default.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
          cache: maven
      - name: Build, test and package the library jar
        # 'verify' (not 'test') so the lib profile's shade execution runs and
        # an overlapping-resource regression is at least visible in the log.
        # No engine needs a native HDF5 library, so the -method 1/4/5 tests run
        # on every leg: there is none to find, and none to skip for.
        run: mvn -B -Plib clean verify
      - name: Package the command-line jar
        run: mvn -B -Pcmdlinejar -DskipTests package
      - name: Build the benchmarks module against the installed root artifact
        # Catches a benchmarks/pom.xml pin that drifted from the root version.
        run: |
          mvn -B -Plib -DskipTests install
          mvn -B -DskipTests -f benchmarks/pom.xml package
      - name: RDF 1.2 / SPARQL 1.2 / rdf-array suites on the disk and parallel engines
        # The vendored W3C suites, the triple-term tests and the rdf-array
        # harness (rdf-tests-contrib and the fork's ported engine tests,
        # RDFARRY.md step 4) build through the engine named by
        # beakgraph.test.engine (method 0 in the run above). Re-run them on the
        # disk pipeline (method 1) and the parallel one (method 3) so the
        # six-engine conformance claim is tested, not assumed.
        if: matrix.os == 'ubuntu-latest'
        run: |
          mvn -B -Plib test -Dsurefire.failIfNoSpecifiedTests=false -Dtest='W3CRdf12SuiteTest,W3CSparql12SuiteTest,RDF12TripleTermTest,RdfArrayContribSuiteTest,UndefSlotsStoreTest,SequenceQueriesStoreTest,ArraySyntaxExamplesStoreTest' -Dbeakgraph.test.engine=method1
          mvn -B -Plib test -Dsurefire.failIfNoSpecifiedTests=false -Dtest='W3CRdf12SuiteTest,W3CSparql12SuiteTest,RDF12TripleTermTest,RdfArrayContribSuiteTest,UndefSlotsStoreTest,SequenceQueriesStoreTest,ArraySyntaxExamplesStoreTest' -Dbeakgraph.test.engine=method3
          # And the rdf-array harness over -arrays stores, every numeric sequence
          # packed, so its queries read packed sequences (RDFARRY.md section 3.6).
          mvn -B -Plib test -Dsurefire.failIfNoSpecifiedTests=false -Dtest='RdfArrayContribSuiteTest,UndefSlotsStoreTest,SequenceQueriesStoreTest,ArraySyntaxExamplesStoreTest' -Dbeakgraph.test.arrays=1,1 -Dbeakgraph.test.engine=method1
          # And the fork's ported engine tests with sequence patterns handed to
          # jena-array's solver (RDFARRY.md section 3.7, layer A), the reference
          # the id-level matcher is held to; the contrib suite runs both routes
          # by itself.
          mvn -B -Plib test -Dsurefire.failIfNoSpecifiedTests=false -Dtest='UndefSlotsStoreTest,SequenceQueriesStoreTest,ArraySyntaxExamplesStoreTest' -Dbeakgraph.sequences.delegate=true
          # And the rdf-array suites over stores with the element index
          # (-seqindex, RDFARRY.md step 8), read for every scan it names
          # candidates for, on a disk engine.
          mvn -B -Plib test -Dsurefire.failIfNoSpecifiedTests=false -Dtest='RdfArrayContribSuiteTest,UndefSlotsStoreTest,SequenceQueriesStoreTest,ArraySyntaxExamplesStoreTest' -Dbeakgraph.test.seqindex=true -Dbeakgraph.seqindex.ratio=0 -Dbeakgraph.test.engine=method4

  native-image:
    # Manual / weekly: builds the GraalVM native binary and runs a conversion
    # through it, so the reachability metadata and the cmdlinenative profile
    # are exercised at all (they never were): an in-memory engine and a
    # disk-based one, which the binary runs too now that it needs no native
    # HDF5 library.
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: 'graalvm-community'
          cache: maven
      - name: Build the native binary
        run: mvn -B -Pcmdlinenative -DskipTests -Dnative.build.heap=12G package
      - name: Convert, export and verify through the binary
        run: |
          printf '<http://ex.org/a> <http://ex.org/p> "x" .\n<http://ex.org/a> <http://ex.org/q> <http://ex.org/b> .\n' > tiny.ttl
          ./target/beakgraph -version
          ./target/beakgraph -src tiny.ttl -dest tiny.h5 -method 3 -cores 2
          ./target/beakgraph -src tiny.h5 -export NT
          ./target/beakgraph -verify tiny.h5 -deep
          test -s tiny.nt
          ./target/beakgraph -src tiny.ttl -dest disk.h5 -method 4 -cores 2 -workdir work
          ./target/beakgraph -verify disk.h5 -deep
